<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;}
  body{
    background:radial-gradient(130% 120% at 50% 0%, #123566 0%, #0b2650 55%, #07182f 100%);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;min-height:100vh;
    padding:calc(14px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));
    -webkit-user-select:none;user-select:none;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .calc{position:relative;width:100%;max-width:380px;margin:auto;
    background:#0e336b;border:1px solid rgba(255,255,255,.18);border-radius:22px;
    padding:15px;overflow:hidden;
    background-image:linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px),
      linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px);
    background-size:24px 24px,24px 24px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);}
  .top{display:flex;align-items:center;justify-content:space-between;margin:4px 4px 12px;}
  .brand{font-size:11px;letter-spacing:.30em;color:#bcd2f0;font-weight:600;
    font-family:ui-monospace,"SF Mono","JetBrains Mono",monospace;}
  .brand b{color:#f2604f;}
  .pill{font-size:11px;letter-spacing:.14em;font-weight:700;color:#cbdcf4;
    font-family:ui-monospace,monospace;padding:5px 11px;border-radius:999px;
    background:rgba(4,20,44,.5);border:1px solid rgba(255,255,255,.22);cursor:pointer;transition:.15s;}
  .pill.deg{color:#f2604f;border-color:rgba(242,96,79,.6);}
  .screen{position:relative;background:rgba(6,22,48,.6);border:1px solid rgba(255,255,255,.16);
    border-radius:14px;padding:16px 16px 14px;margin-bottom:14px;overflow:hidden;
    background-image:linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px),
      linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px);
    background-size:22px 22px,22px 22px;}
  .expr{min-height:30px;font-size:22px;line-height:1.35;text-align:right;color:#eef4fd;
    font-family:ui-monospace,"SF Mono","JetBrains Mono",monospace;word-break:break-all;
    white-space:pre-wrap;letter-spacing:.5px;}
  .expr .ph{color:#5c7db0;}
  .caret{color:#f2604f;animation:blink 1.1s step-end infinite;}
  @keyframes blink{50%{opacity:0;}}
  .prev{min-height:22px;margin-top:6px;font-size:16px;text-align:right;color:#8fabd6;
    font-family:ui-monospace,monospace;letter-spacing:.5px;}
  .prev.err{color:#ff8a7d;}
  .grid-sci{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:9px;}
  .grid-basic{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
  button.key{border:none;border-radius:12px;cursor:pointer;touch-action:manipulation;
    font-family:ui-sans-serif,system-ui,sans-serif;transition:transform .04s,background .15s,filter .15s;
    -webkit-user-select:none;user-select:none;}
  button.key:active{transform:translateY(1px) scale(.985);}
  .k-sci{height:42px;font-size:14px;font-weight:600;background:rgba(11,40,84,.7);color:#a8c6ee;
    border:1px solid rgba(255,255,255,.14);font-family:ui-monospace,"SF Mono",monospace;}
  .k-sci.mode{color:#f2604f;border-color:rgba(242,96,79,.55);}
  .k-num{height:58px;font-size:24px;font-weight:500;background:rgba(21,64,124,.85);color:#eef4fd;
    border:1px solid rgba(255,255,255,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);}
  .k-util{height:58px;font-size:19px;font-weight:600;background:rgba(12,44,90,.8);color:#a9c4ec;
    border:1px solid rgba(255,255,255,.10);}
  .k-op{height:58px;font-size:26px;font-weight:600;background:rgba(9,34,72,.7);color:#ffffff;
    border:1px solid rgba(255,255,255,.30);}
  .k-eq{height:58px;font-size:28px;font-weight:700;color:#fff;
    background:linear-gradient(180deg,#ef5a49,#d33d31);
    box-shadow:0 6px 16px -6px rgba(224,74,58,.7);}
  .credit{margin:14px 4px 2px;text-align:center;font-size:10.5px;letter-spacing:.22em;
    color:#7f9fce;font-weight:600;font-family:ui-monospace,"SF Mono",monospace;text-transform:uppercase;}
  .credit b{color:#f2604f;font-weight:600;}
  @media (hover:hover){
    .k-sci:hover{background:rgba(15,50,100,.9);color:#c6dcf7;}
    .k-num:hover{background:rgba(28,78,146,.95);}
    .k-util:hover{background:rgba(16,56,110,.95);color:#c9def5;}
    .k-op:hover{background:rgba(14,46,92,.9);}
    .k-eq:hover{filter:brightness(1.06);}
  }

<script>
"use strict";

/* ---------- avaliador ---------- */
function tokenize(s){
  const t=[]; let i=0;
  while(i<s.length){
    const c=s[i];
    if(c===' '){i++;continue;}
    if(/[0-9.]/.test(c)){ let j=i; while(j<s.length && /[0-9.]/.test(s[j])) j++;
      t.push({type:'num',value:parseFloat(s.slice(i,j))}); i=j; continue; }
    if(/[a-zA-Z]/.test(c)){ let j=i; while(j<s.length && /[a-zA-Z0-9]/.test(s[j])) j++;
      t.push({type:'id',value:s.slice(i,j)}); i=j; continue; }
    if('+-*/^!()'.includes(c)){ t.push({type:'op',value:c}); i++; continue; }
    throw new Error('char');
  }
  return t;
}
function factorial(n){
  if(n<0 || !Number.isInteger(n)) throw new Error('fact');
  if(n>170) return Infinity;
  let r=1; for(let i=2;i<=n;i++) r*=i; return r;
}
function evaluate(expr, mode){
  const toks=tokenize(expr); let pos=0;
  const peek=()=>toks[pos], next=()=>toks[pos++];
  const deg=mode==='DEG', D=Math.PI/180;
  function pAdd(){ let v=pMul();
    while(peek()&&peek().type==='op'&&(peek().value==='+'||peek().value==='-')){
      const op=next().value,r=pMul(); v=op==='+'?v+r:v-r;} return v; }
  function pMul(){ let v=pUnary();
    while(true){ const p=peek(); if(!p)break;
      if(p.type==='op'&&(p.value==='*'||p.value==='/')){ const op=next().value,r=pUnary(); v=op==='*'?v*r:v/r; }
      else if(p.type==='num'||p.type==='id'||(p.type==='op'&&p.value==='(')){ v=v*pUnary(); }
      else break; } return v; }
  function pUnary(){ const p=peek();
    if(p&&p.type==='op'&&(p.value==='-'||p.value==='+')){ next(); const v=pUnary(); return p.value==='-'?-v:v; }
    return pPow(); }
  function pPow(){ let b=pPost(); const p=peek();
    if(p&&p.type==='op'&&p.value==='^'){ next(); return Math.pow(b,pUnary()); } return b; }
  function pPost(){ let v=pPrim();
    while(peek()&&peek().type==='op'&&peek().value==='!'){ next(); v=factorial(v); } return v; }
  function pPrim(){ const p=peek(); if(!p) throw new Error('end');
    if(p.type==='num'){ next(); return p.value; }
    if(p.type==='op'&&p.value==='('){ next(); const v=pAdd();
      if(!peek()||peek().value!==')') throw new Error(')'); next(); return v; }
    if(p.type==='id'){ next(); const n=p.value.toLowerCase();
      if(n==='pi') return Math.PI; if(n==='e') return Math.E;
      if(!peek()||peek().value!=='(') throw new Error('('); next(); const a=pAdd();
      if(!peek()||peek().value!==')') throw new Error(')'); next(); return fn(n,a); }
    throw new Error('tok'); }
  function fn(n,x){ switch(n){
    case 'sin': return Math.sin(deg?x*D:x);
    case 'cos': return Math.cos(deg?x*D:x);
    case 'tan': return Math.tan(deg?x*D:x);
    case 'log': case 'ln': return Math.log(x);
    case 'log10': return Math.log10(x);
    case 'sqrt': return Math.sqrt(x);
    default: throw new Error('fn'); } }
  const r=pAdd(); if(pos!==toks.length) throw new Error('trail'); return r;
}
function balance(e){ const o=(e.match(/\(/g)||[]).length,c=(e.match(/\)/g)||[]).length;
  return e+')'.repeat(Math.max(0,o-c)); }
function fmt(n){ if(!isFinite(n)) return null;
  if(Number.isInteger(n)&&Math.abs(n)<1e15) return String(n);
  return parseFloat(n.toPrecision(12)).toString(); }
function compute(expr,mode){ if(!expr.trim()) return {ok:true,value:''};
  try{ const v=evaluate(balance(expr),mode); const s=fmt(v);
    if(s===null) return {ok:false}; return {ok:true,value:s}; }
  catch(e){ return {ok:false}; } }

/* ---------- inserção inteligente ---------- */
function last(s){ return s.slice(-1); }
function needsMul(e){ return /[0-9.)]/.test(last(e))||e.endsWith('pi'); }
function insertToken(e,tok,kind){
  if((kind==='func'||kind==='const'||kind==='open')&&needsMul(e)) return e+'*'+tok;
  if(kind==='num'&&(last(e)===')'||e.endsWith('pi'))) return e+'*'+tok;
  return e+tok;
}
function toggleSign(e){
  const m=e.match(/(-?\d*\.?\d+)$/);
  if(!m) return e.startsWith('-')?e.slice(1):'-'+e;
  const n=m[1], start=e.length-n.length, before=e[start-1];
  const flip=n.startsWith('-')?n.slice(1):'-'+n;
  if(n.startsWith('-')||before===undefined||/[(*/^+]/.test(before)) return e.slice(0,start)+flip;
  return e.slice(0,start)+'('+flip+')';
}
function prettify(s){
  return s.replace(/log10\(/g,'\u0001').replace(/log\(/g,'ln(').replace(/\u0001/g,'log(')
    .replace(/sqrt\(/g,'\u221a(').replace(/pi/g,'\u03c0')
    .replace(/\*/g,'\u00d7').replace(/\//g,'\u00f7').replace(/-/g,'\u2212');
}

/* ---------- botões ---------- */
const SCI=[
  ['sin','sin(','func'],['cos','cos(','func'],['tan','tan(','func'],['ln','log(','func'],['log','log10(','func'],
  ['\u221a','sqrt(','func'],['x\u00b2','^2','op'],['x\u02b8','^','op'],['(','(','open'],[')',')','close'],
  ['\u03c0','pi','const'],['e','e','const'],['n!','!','op'],['1/x','1/(','open'],['ANG','__mode__','mode']
];
const BASIC=[
  ['AC','__clear__','util'],['\u232b','__back__','util'],['%','/100','util'],['\u00f7','/','operator'],
  ['7','7','num'],['8','8','num'],['9','9','num'],['\u00d7','*','operator'],
  ['4','4','num'],['5','5','num'],['6','6','num'],['\u2212','-','operator'],
  ['1','1','num'],['2','2','num'],['3','3','num'],['+','+','operator'],
  ['\u00b1','__sign__','util'],['0','0','num'],['.','.','dot'],['=','__eq__','equals']
];

let expr='', mode='DEG', errTimer=null;
const exprEl=document.getElementById('expr'),
      prevEl=document.getElementById('prev'),
      modeEl=document.getElementById('mode');

function render(err){
  const p=prettify(expr);
  exprEl.innerHTML=(p?escapeHtml(p):'<span class="ph">0</span>')+'<span class="caret">\u2502</span>';
  const r=compute(expr,mode);
  if(err){ prevEl.textContent='Erro'; prevEl.classList.add('err'); }
  else{ prevEl.classList.remove('err');
    prevEl.textContent=(r.ok&&r.value!==''&&r.value!==expr)?('= '+prettify(r.value)):''; }
}
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function act(value,kind){
  if(value==='__mode__'){ mode=mode==='DEG'?'RAD':'DEG'; modeEl.textContent=mode;
    modeEl.classList.toggle('deg',mode==='DEG'); render(); return; }
  if(value==='__clear__'){ expr=''; render(); return; }
  if(value==='__back__'){ expr=expr.slice(0,-1); render(); return; }
  if(value==='__sign__'){ expr=toggleSign(expr); render(); return; }
  if(value==='__eq__'){ const r=compute(expr,mode);
    if(r.ok&&r.value!==''){ expr=r.value; render(); }
    else{ render(true); clearTimeout(errTimer); errTimer=setTimeout(render,600); }
    return; }
  expr=insertToken(expr,value,kind); render();
}

function onKey(ev){
  const b=ev.target.closest('button'); if(!b) return;
  act(b.dataset.val, b.dataset.kind);
}
document.getElementById('sci').addEventListener('click',onKey);
document.getElementById('basic').addEventListener('click',onKey);
modeEl.addEventListener('click',()=>act('__mode__'));

/* teclado físico (quando aberto no navegador) */
const kmap={'+':['+','operator'],'-':['-','operator'],'*':['*','operator'],'/':['/','operator'],
  '^':['^','op'],'(':['(','open'],')':[')','close'],'%':['/100','util'],'.':['.','dot']};
for(let d=0;d<=9;d++) kmap[String(d)]=[String(d),'num'];
window.addEventListener('keydown',(ev)=>{
  if(ev.key==='Enter'||ev.key==='='){ ev.preventDefault(); act('__eq__'); return; }
  if(ev.key==='Backspace'){ ev.preventDefault(); act('__back__'); return; }
  if(ev.key==='Escape'){ ev.preventDefault(); act('__clear__'); return; }
  const m=kmap[ev.key]; if(m){ ev.preventDefault(); act(m[0],m[1]); }
});

/* evita zoom por duplo toque no iOS */
let lastTouch=0;
document.addEventListener('touchend',(e)=>{
  const now=Date.now(); if(now-lastTouch<=300){ e.preventDefault(); } lastTouch=now;
},{passive:false});

render();
</script>
