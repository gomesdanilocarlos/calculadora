<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recado">
<meta name="theme-color" content="#221860">
<title>Recado para o Display</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter+Tight:wght@500;600;700&display=swap">
<style>
:root{--bg:#221860;--card:rgba(255,255,255,.08);--ink:#f4f1ff;--soft:rgba(244,241,255,.7);--accent:#7d9bff;--ok:#7dffb0;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:linear-gradient(160deg,#221860,#3b2aa0 55%,#2440c8);color:var(--ink);font-family:"Inter Tight",-apple-system,Helvetica,Arial,sans-serif;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:max(28px,env(safe-area-inset-top,0px)) 28px;box-sizing:border-box}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:"Dancing Script",cursive;font-size:44px;margin:0;line-height:1.1}
p{margin:0;color:var(--soft);line-height:1.45}
textarea{width:100%;box-sizing:border-box;min-height:120px;resize:vertical;border-radius:16px;border:1px solid rgba(255,255,255,.25);background:var(--card);color:var(--ink);
  font:600 20px/1.35 "Inter Tight",-apple-system,sans-serif;padding:14px 16px}
textarea:focus{outline:2px solid var(--accent);outline-offset:2px}
.count{font-size:13px;color:var(--soft);text-align:right;margin-top:-10px}
button{font:700 18px "Inter Tight",-apple-system,sans-serif;border:0;border-radius:14px;padding:16px;cursor:pointer}
#send{background:var(--ink);color:#221860}
#auto{background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.35)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5}
#status{min-height:1.4em;font-weight:600}
#status.ok{color:var(--ok)}
#status.err{color:#ffb3a8}
</style>
</head>
<body>
<main>
  <h1>Recado</h1>
  <p>Escreve a mensagem e toca em Enviar. Ela aparece no iPad em poucos segundos, embaixo da temperatura.</p>
  <form id="f">
    <label for="t" style="position:absolute;left:-9999px">Mensagem</label>
    <textarea id="t" maxlength="80" placeholder="Ex.: Te amo, bom dia!"></textarea>
  </form>
  <div class="count"><span id="n">0</span>/80</div>
  <button id="send" type="submit" form="f">Enviar</button>
  <button id="auto" type="button">Voltar ao automático</button>
  <div id="status" role="status"></div>
</main>
<script>
const TOPIC="display-danilo-carol-x7q4";
const t=document.getElementById("t"),st=document.getElementById("status");
t.addEventListener("input",()=>document.getElementById("n").textContent=t.value.length);
async function post(text,label){
  st.className="";st.textContent="Enviando…";
  document.querySelectorAll("button").forEach(b=>b.disabled=true);
  try{
    const r=await fetch("https://ntfy.sh/"+TOPIC,{method:"POST",body:text});
    if(!r.ok)throw new Error(r.status);
    st.className="ok";st.textContent=label;
  }catch(e){
    st.className="err";st.textContent="Não foi enviado. Confere a internet e tenta de novo.";
  }
  document.querySelectorAll("button").forEach(b=>b.disabled=false);
}
document.getElementById("f").addEventListener("submit",e=>{
  e.preventDefault();
  const v=t.value.trim();
  if(!v){st.className="err";st.textContent="Escreve uma mensagem primeiro.";return}
  post(v,"Enviado! Já está no iPad.");
});
document.getElementById("auto").addEventListener("click",()=>post("auto","Pronto, voltou ao Bom dia / Boa tarde / Boa noite."));
</script>
</body>
</html>
